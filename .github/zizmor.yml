# zizmor configuration (https://docs.zizmor.sh/configuration/).
# ci.yml restores Gradle's cache (setup-gradle) and runs on pull requests and on main, never on a tag or a release:
# nothing it builds is published as a release, so a poisoned cache could not reach one. Remove this exception if a
# release job ever joins that workflow.
rules:
  cache-poisoning:
    ignore:
      - ci.yml
