# Maestro on an Android emulator (KVM on the Linux runner). The app is built in release, as a phone would run it.
# Heavy (about 30 minutes): on main, by hand, and on a pull request only with the label `full-ci` (rule of 30/10).
name: E2E

on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  # Every commit of main keeps its run; a newer push replaces the run of a branch.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  e2e-android:
    name: e2e-android
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release build and the system image leave about 2 GB on the runner, and the emulator needs about 7 GB for
      # its userdata partition (run 41016791024): drop toolchains this job never uses before anything is installed.
      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome \
            /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # No Ostrom server runs here: the flows prove the release build starts and holds its own checks.
      - name: Build the Android app (release, x86_64 for the emulator)
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro (pinned)
        env:
          MAESTRO_VERSION: 2.12.0
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          # A smaller userdata partition than the default: the flows install one APK.
          disk-size: 4096M
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test --format junit --output maestro-report.xml --test-output-dir maestro-output .maestro/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            maestro-output/
          if-no-files-found: ignore
