# Throwaway (security audit of the app): reads the native configuration a store build gets from `expo prebuild`.
name: Audit native probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Prebuild Android and iOS, as a store build
        run: npx expo prebuild --platform all --no-install
      - name: Android main manifest
        run: cat android/app/src/main/AndroidManifest.xml
      - name: Android debug manifest
        run: cat android/app/src/debug/AndroidManifest.xml || true
      - name: Android other source sets and backup rules
        run: |
          find android/app/src -name '*.xml' -path '*xml*' | sort
          for f in $(find android/app/src/main/res/xml -name '*.xml' 2> /dev/null); do echo "== $f"; cat "$f"; done
          grep -n "debuggable\|minifyEnabled\|shrinkResources\|signingConfig" android/app/build.gradle
      - name: iOS Info.plist and entitlements
        run: |
          for f in $(find ios -maxdepth 2 \( -name Info.plist -o -name '*.entitlements' \) | sort); do echo "== $f"; cat "$f"; done
