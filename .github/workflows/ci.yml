name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # No tag trigger: this job publishes nothing, and a release-like trigger makes the npm cache a poisoning risk (zizmor).
  push:
    branches: [main]
  workflow_dispatch:

# One run per workflow and ref; a new push cancels the previous run, except on main (JOURNAL 03:10).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The single job of a pull request and the required check on main (ostrom-e2e/templates/README.md).
  ci:
    name: ci
    # A draft pull request runs no CI: mark it ready when you want it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:ci
      - name: Expo config is valid
        run: npx expo config --type public > /dev/null
