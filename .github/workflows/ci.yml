name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # No tag trigger: this job publishes nothing, and a release-like trigger makes the npm cache a poisoning risk (zizmor).
  push:
    branches: [main]
  workflow_dispatch:

# One run per workflow and ref; a new push cancels the previous run, except on main (JOURNAL 03:10).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The single job of a pull request and the required check on main (ostrom-e2e/templates/README.md).
  ci:
    name: ci
    # A draft pull request runs no CI: mark it ready when you want it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # Three production bundle exports (store check) come on top of the tests.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned ostrom-core commit
        id: core
        run: echo "sha=$(tr -d '[:space:]' < contract/CORE_SHA)" >> "$GITHUB_OUTPUT"
      - name: Check out ostrom-core at that commit
        uses: actions/checkout@v4
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.sha }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: .core
          sparse-checkout: api/openapi.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The contract copy is ostrom-core's, byte for byte
        run: cmp contract/openapi.yaml .core/api/openapi.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The generated types are those of the copy
        run: npm run gen:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test, 100 % coverage
        run: npm run test:ci
      - name: Expo config is valid
        run: npx expo config --type public > /dev/null
      - name: No store bundle carries the in-memory server
        run: scripts/check-store-bundle.sh
