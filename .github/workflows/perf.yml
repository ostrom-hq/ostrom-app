# The performance pass of the app (scripts/perf-measure.sh): cold start, sizes, calls at launch, and the long lists
# scrolled, on an Android emulator against the release E2E build. Heavy, like E2E: by hand, and on a pull request
# labelled `perf`. Its numbers are compared run with run (the emulator renders without a GPU), never with a phone.
name: Perf

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-android:
    name: perf-android
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome \
            /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null
          free_kib=$(df --output=avail -k / | tail -n 1)
          echo "Free on / after the cleanup: $((free_kib / 1024 / 1024)) GiB"
          if [ "$free_kib" -lt $((8 * 1024 * 1024)) ]; then
            echo "::error::Less than 8 GiB free after the cleanup: the build and the emulator would not fit"
            exit 1
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # No Ostrom server runs here: the E2E build talks to the in-memory server of src/api/mocks
      # (EXPO_PUBLIC_OSTROM_MOCK=1, inlined at build time), through the real HTTP client, repositories and screens.
      - name: Build the Android app (release, x86_64 for the emulator)
        env:
          EXPO_PUBLIC_OSTROM_MOCK: "1"
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro (pinned)
        env:
          MAESTRO_VERSION: 2.12.0
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Measure on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          script: scripts/perf-measure.sh android/app/build/outputs/apk/release/app-release.apk "$(find android/app/build/generated -name index.android.bundle | head -n 1)"
      - name: Summary
        if: always()
        run: |
          if [ -f perf/summary.md ]; then
            { echo "## Perf"; echo; cat perf/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf
          path: perf/
          if-no-files-found: ignore
