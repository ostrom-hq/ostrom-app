# Against the real Ostrom server (ostrom-server's app-journey workflow), in a build given no session
# (EXPO_PUBLIC_OSTROM_E2E_SIGN_IN=browser): the app's own GitHub sign-in, through Chrome, the server and the demo stack's
# fake GitHub (both reached on 127.0.0.1 through `adb reverse`). AUDIT-SECU-APP-2 N1: a mobile sign-in's code goes back
# to the app only on the person's tap. The server's page names who signed in; closing it signs nothing in, tapping
# "Back to Ostrom" does. Signed in as the journey's phone person (${OSTROM_E2E_LOGIN}), owner of its organization.
appId: run.ostrom.app
---
- launchApp:
    clearState: true

# Left without the tap: the app stays signed out.
- tapOn:
    id: "login-github"
- runFlow:
    file: ../common/chrome-to-fake-github.yaml
    env:
      LOGIN: ${OSTROM_E2E_LOGIN}
- extendedWaitUntil:
    visible: "Sign in to the Ostrom app as @${OSTROM_E2E_LOGIN}\\?"
    timeout: 30000
- assertVisible: "Back to Ostrom"
- takeScreenshot: confirm-page
# Chrome's close button, not Back: Back goes back in the tab's history, to the authorize page.
- tapOn: "Close tab"
- extendedWaitUntil:
    visible:
      id: "login-github"
    timeout: 30000
- assertNotVisible:
    id: "inbox-list"
- takeScreenshot: confirm-left

# The tap: the app signs in.
- tapOn:
    id: "login-github"
- runFlow:
    file: ../common/chrome-to-fake-github.yaml
    env:
      LOGIN: ${OSTROM_E2E_LOGIN}
- extendedWaitUntil:
    visible: "Sign in to the Ostrom app as @${OSTROM_E2E_LOGIN}\\?"
    timeout: 30000
- tapOn: "Back to Ostrom"
- extendedWaitUntil:
    visible:
      id: "inbox-list"
    timeout: 30000
- assertNotVisible: "Unmatched Route"
- takeScreenshot: confirm-signed-in
