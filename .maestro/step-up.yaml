# A yes on the production deploy needs a fresh sign-in: the server answers 403 step_up_required. The app explains it,
# shows no raw error, and offers to open the console on this request.
appId: run.ostrom.app
---
- runFlow: common/sign-in.yaml
- scrollUntilVisible:
    element:
      id: "request-appr_0004"
    direction: DOWN
- tapOn:
    id: "request-appr_0004"
# The buttons come after the evidence, below the fold on a phone.
- scrollUntilVisible:
    element:
      id: "request-approve"
    direction: DOWN
- assertNotVisible:
    id: "request-open-console"
- tapOn:
    id: "request-approve"
- extendedWaitUntil:
    visible: "Ostrom wants a fresh sign-in for this yes: confirm it in the console."
    timeout: 15000
- assertNotVisible: ".*step_up_required.*"
- scrollUntilVisible:
    element:
      id: "request-open-console"
    direction: DOWN
# The tap opens the browser on the console, outside the app: its address is checked by the unit tests.
- takeScreenshot: step-up
