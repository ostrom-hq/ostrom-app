# Signed out on a new phone: the login screen, and an address that is not a server is refused.
appId: run.ostrom.app
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login-github"
- assertVisible: "Agents propose. People decide."
- tapOn:
    id: "login-server"
# More than any prefilled address, whatever the build was configured with.
- eraseText: 200
- inputText: "http://ostrom.acme.dev"
- hideKeyboard
- tapOn:
    id: "login-github"
- assertVisible: "Enter the address of your Ostrom server, starting with https://."
- takeScreenshot: login-refused
