# S2-24 on the emulator (AUDIT-SECU-APP-2 A4): the real sign-in, down to the system browser and the ostrom:// return.
# Only the return the app asked for connects; a replayed or foreign one connects nothing; the return opens no screen.
appId: run.ostrom.app
---
# The good return: the sign-in's own state, and the code of its PKCE challenge.
- launchApp:
    clearState: true
- runFlow:
    file: common/browser-sign-in.yaml
    env:
      SERVER: "https://good.browser.example"
- extendedWaitUntil:
    visible:
      id: "inbox-list"
    timeout: 30000
- assertNotVisible: "Unmatched Route"
- takeScreenshot: return-good
# The return, played again while the app runs: no screen opens, the inbox stays.
- openLink: "ostrom://auth/callback?code=pkce%3Astray&state=stray"
- assertVisible:
    id: "inbox-list"
- assertNotVisible: "Unmatched Route"
# The return launching the app: it opens on its first screen, signed in as it was.
- stopApp
- openLink: "ostrom://auth/callback?code=pkce%3Astray&state=stray"
- extendedWaitUntil:
    visible:
      id: "inbox-list"
    timeout: 30000
- assertNotVisible: "Unmatched Route"
- takeScreenshot: return-cold-start
# A replayed return: the code and state of the good sign-in, on a new sign-in. Refused, still signed out.
- launchApp:
    clearState: true
- runFlow:
    file: common/browser-sign-in.yaml
    env:
      SERVER: "https://replay.browser.example"
- extendedWaitUntil:
    visible: "This sign-in did not come from this app. Try again."
    timeout: 30000
- assertVisible:
    id: "login-github"
- assertNotVisible:
    id: "inbox-list"
- assertNotVisible: "Unmatched Route"
- takeScreenshot: return-replayed
# A foreign state: refused too.
- runFlow:
    file: common/browser-sign-in.yaml
    env:
      SERVER: "https://forged.browser.example"
- extendedWaitUntil:
    visible: "This sign-in did not come from this app. Try again."
    timeout: 30000
- assertVisible:
    id: "login-github"
- assertNotVisible:
    id: "inbox-list"
- takeScreenshot: return-forged
