# Signs in on a new phone. The E2E build answers from the in-memory server (EXPO_PUBLIC_OSTROM_MOCK=1), signed in as rev-b.
appId: run.ostrom.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "login-server"
- eraseText: 200
- inputText: "https://ostrom.example"
- hideKeyboard
- tapOn:
    id: "login-github"
- extendedWaitUntil:
    visible:
      id: "inbox-list"
    timeout: 20000
