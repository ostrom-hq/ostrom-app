# Against the real Ostrom server (ostrom-server's app-journey workflow). The job signed the phone's person in with
# GitHub as the app does (PKCE to its deep link, `POST /auth/mobile/token`) and gave the build that session and its
# unlock key; another member of their organization asked two pushes to main that wait for them. The app reads the
# real yes queue, says yes to one (biometrics, then the unlock on the server) and no to the other, then shows both
# signed receipts, verified on the phone, the organization's activity (the yes, the no and the two requests) and its
# spending (nothing yet, against the $50 monthly budget the job set). The job checks the gates and receipts through
# the API afterwards.
appId: run.ostrom.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "login-github"
- extendedWaitUntil:
    visible:
      id: "request-${OSTROM_E2E_YES}"
    timeout: 30000
- assertVisible:
    id: "request-${OSTROM_E2E_NO}"
- takeScreenshot: real-inbox

# The yes.
- tapOn:
    id: "request-${OSTROM_E2E_YES}"
# The buttons come after the evidence, below the fold on a phone.
- scrollUntilVisible:
    element:
      id: "request-approve"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "request-approve"
# The decision shows under the title, at the top of the request.
- scrollUntilVisible:
    element: "Approved by .*"
    direction: UP
    timeout: 30000
- takeScreenshot: real-approved
- back

# The no, with its reason.
- extendedWaitUntil:
    visible:
      id: "request-${OSTROM_E2E_NO}"
    timeout: 20000
- tapOn:
    id: "request-${OSTROM_E2E_NO}"
- scrollUntilVisible:
    element:
      id: "request-decline"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "request-decline"
- tapOn:
    id: "request-reason"
- inputText: "Not this push"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "request-send-decline"
    direction: DOWN
- tapOn:
    id: "request-send-decline"
- scrollUntilVisible:
    element: "Declined by .*"
    direction: UP
    timeout: 30000
- takeScreenshot: real-declined
- back

# Who is signed in, and their only organization.
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "${OSTROM_E2E_LOGIN}"
    timeout: 20000
- extendedWaitUntil:
    visible: "acme-e2e"
    timeout: 20000
- takeScreenshot: real-settings

# Both decisions, signed by the server and verified on the phone against the key it publishes.
- tapOn: "History"
- extendedWaitUntil:
    visible: "Signature verified on this phone.*"
    timeout: 30000
# Both receipts, the yes and the no: a second verified row.
- extendedWaitUntil:
    visible:
      text: "Signature verified on this phone.*"
      index: 1
    timeout: 30000
- assertNotVisible: "Signature rejected.*"
- assertNotVisible: "Not verified.*"
- takeScreenshot: real-history

# The organization's activity (`GET /activity`): the phone's yes and no, said by its person, and the two requests.
- tapOn: "Activity"
- extendedWaitUntil:
    visible: "${OSTROM_E2E_LOGIN} said yes to: .*"
    timeout: 30000
- assertVisible: "${OSTROM_E2E_LOGIN} said no to: .*"
- assertVisible:
    text: ".* asked for a yes: .*"
    index: 1
- assertNotVisible: "No activity yet."
- assertNotVisible: "The activity could not be loaded."
- takeScreenshot: real-activity

# Its spending (`GET /spending`): read from the server, a total of $0.00 and nothing spent by a new organization.
- tapOn: "Spending"
- extendedWaitUntil:
    visible: "\\$0\\.00"
    timeout: 30000
- assertVisible: "Nothing spent."
# The budget the job set (PUT /budgets, the organization's $50 a month): what was spent against it.
- assertVisible: "0 % of the \\$50\\.00 budget"
- assertNotVisible: "The spending could not be loaded."
- takeScreenshot: real-spending

# The person's own account (`GET /auth/me/account`, in no organization): the phone's person signed in with GitHub, so
# their GitHub is linked; the sessions and workstations are managed in the console, which the app opens.
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "settings-my-account"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-my-account"
- extendedWaitUntil:
    visible:
      id: "account-github-linked"
    timeout: 30000
- assertVisible: "${OSTROM_E2E_LOGIN}"
- assertVisible:
    id: "account-open-console"
- assertNotVisible: "Your account could not be loaded."
- takeScreenshot: real-account
