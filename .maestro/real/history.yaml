# Against the real Ostrom server (e2e-real workflow): signed in with the token the CI made for a new person of a new
# organization, the History reads that server's receipts and its signing keys: none yet. Settings shows who signed in.
appId: run.ostrom.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "login-github"
- extendedWaitUntil:
    visible: "History"
    timeout: 30000
- tapOn: "History"
- extendedWaitUntil:
    visible: "No receipt yet."
    timeout: 30000
- takeScreenshot: real-history
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "${OSTROM_E2E_LOGIN}"
    timeout: 20000
- takeScreenshot: real-settings
