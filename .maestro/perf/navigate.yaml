# The performance pass (scripts/perf-measure.sh): rounds of navigation through the tabs, each long list scrolled, for the
# memory measured over 5 minutes of navigation. ${ROUNDS} rounds per run of the flow, between two memory readings.
appId: run.ostrom.app
---
- launchApp:
    stopApp: false
- repeat:
    times: ${ROUNDS}
    commands:
      - tapOn: "History"
      - extendedWaitUntil:
          visible:
            id: "receipt-.*"
          timeout: 30000
      - scroll
      - scroll
      - scroll
      - tapOn: "Activity"
      - extendedWaitUntil:
          visible:
            id: "activity-list"
          timeout: 30000
      - scroll
      - scroll
      - scroll
      - tapOn: "Spending"
      - tapOn: "Settings"
      - tapOn: "Inbox"
      - extendedWaitUntil:
          visible:
            id: "inbox-list"
          timeout: 30000
      - scroll
      - scroll
      - scroll
