org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=true
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The app's version (release-please keeps it). Store builds get their build number from fastlane (docs/distribution.md).
# x-release-please-start-version
ostromAppVersion=0.1.0
# x-release-please-end
# ostrom-core published on GitHub Packages (0.1.<run of its main build>), used without a checkout of ostrom-core next
# to this one. CI builds the commit of gradle/ostrom-core.ref instead: change both together.
ostromCoreVersion=0.1.0-SNAPSHOT
# ostrom-core included from a checkout (settings.gradle.kts) builds its api and client for Android and iOS too.
ostrom.mobileTargets=true
